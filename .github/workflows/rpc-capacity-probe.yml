name: rpc native validation

on:
  push:
    branches: ["feat/rpc-capacity-probe-20261006"]

permissions:
  contents: read

concurrency:
  group: rpc-native-validation-zed-test
  cancel-in-progress: true

jobs:
  rpc:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch immutable mirror and verify provenance
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/gha-indie-worker/gha-indie-worker-e2e.git rpc-mirror
          cd rpc-mirror
          git checkout --quiet ec9836e75e8addab2cf4dd0114ae8cca14205a03
          test "$(git rev-parse HEAD)" = "ec9836e75e8addab2cf4dd0114ae8cca14205a03"

          grep -Fx "compiler_source=ores-truffle-oreslang/oreslang-source.java@43ec8b5e1a2c36e9f0b277dcc609f5383a326f37" rpc-ci/PROVENANCE.txt
          grep -Fx "rpc_source=ores-truffle-oreslang/oreslang-rpc@e24797c1d9b23ffa430c1e610d9205c112a79caf" rpc-ci/PROVENANCE.txt
          grep -Fx "rpc_tree=24325867836dc2a8b18fa0cc370f32efbaa10735" rpc-ci/PROVENANCE.txt

          while read -r expected path; do
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || {
              echo "::error file=$path::compiler blob mismatch expected=$expected actual=$actual"
              exit 1
            }
          done < rpc-ci/compiler-blobs.txt
          test "$(wc -l < rpc-ci/compiler-blobs.txt)" -eq 56

          test "$(git rev-parse HEAD:rpc-ci/oreslang-rpc)" = "24325867836dc2a8b18fa0cc370f32efbaa10735"
          test "$(git hash-object rpc-ci/oreslang-http-routing/src/http_routing.ores)" = "7e448d4e13de1e0c163c73424c85b37b969aef3a"

      - name: Compile exact compiler mirror
        working-directory: rpc-mirror
        run: mvn -B -ntp -Dmaven.test.skip=true compile

      - name: Typecheck native collection regression
        working-directory: rpc-mirror
        run: mvn -B -ntp -Dmaven.test.skip=true exec:java -Dexec.args="--check --platform=server rpc-ci/collection-runtime/main.ores"

      - name: Execute native collection regression
        working-directory: rpc-mirror
        shell: bash
        run: |
          set -euo pipefail
          if ! mvn -q -Dstyle.color=never -Dmaven.test.skip=true exec:java -Dexec.args="--platform=server rpc-ci/collection-runtime/main.ores" > rpc-ci/collection-runtime/actual.txt 2> rpc-ci/collection-runtime/runtime.err; then
            echo "=== collection stdout before failure ==="
            cat rpc-ci/collection-runtime/actual.txt || true
            echo "=== collection stderr ==="
            cat rpc-ci/collection-runtime/runtime.err || true
            exit 1
          fi
          diff -u rpc-ci/collection-runtime/expected.txt rpc-ci/collection-runtime/actual.txt

      - name: Typecheck HTTP routing module directly
        working-directory: rpc-mirror
        run: mvn -B -ntp -Dmaven.test.skip=true exec:java -Dexec.args="--check --platform=server rpc-ci/oreslang-http-routing/src/http_routing.ores"

      - name: Run native collection regression test
        working-directory: rpc-mirror
        run: mvn -B -ntp -Dtest=NativeCollectionMemberRuntimeTest test

      - name: Typecheck native RPC module directly
        working-directory: rpc-mirror
        run: mvn -B -ntp -Dmaven.test.skip=true exec:java -Dexec.args="--check --platform=server rpc-ci/oreslang-rpc/src/rpc.ores"

      - name: Typecheck linked RPC semantics
        working-directory: rpc-mirror
        run: mvn -B -ntp -Dmaven.test.skip=true exec:java -Dexec.args="--check --platform=server rpc-ci/oreslang-rpc/tests/rpc_semantics.ores"

      - name: Execute RPC semantics and generators
        working-directory: rpc-mirror
        shell: bash
        run: |
          set -euo pipefail
          if ! mvn -q -Dstyle.color=never -Dmaven.test.skip=true exec:java -Dexec.args="--platform=server rpc-ci/oreslang-rpc/tests/rpc_semantics.ores" > rpc-ci/oreslang-rpc/tests/actual.txt 2> rpc-ci/runtime.err; then
            cat rpc-ci/oreslang-rpc/tests/actual.txt || true
            cat rpc-ci/runtime.err || true
            exit 1
          fi
          diff -u rpc-ci/oreslang-rpc/tests/expected.txt rpc-ci/oreslang-rpc/tests/actual.txt

      - name: Typecheck RPC HTTP-routing integration
        working-directory: rpc-mirror
        run: mvn -B -ntp -Dmaven.test.skip=true exec:java -Dexec.args="--check --platform=server rpc-ci/http-interop/main.ores"

      - name: Execute RPC HTTP-routing round trip
        working-directory: rpc-mirror
        shell: bash
        run: |
          set -euo pipefail
          mvn -q -Dstyle.color=never -Dmaven.test.skip=true exec:java -Dexec.args="--platform=server rpc-ci/http-interop/main.ores" > rpc-ci/http-interop/actual.txt
          diff -u rpc-ci/http-interop/expected.txt rpc-ci/http-interop/actual.txt
