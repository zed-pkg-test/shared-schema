name: rpc native validation

on:
  push:
    branches: ["feat/rpc-capacity-probe-20261006"]

permissions:
  contents: read

concurrency:
  group: rpc-native-validation-zed-test
  cancel-in-progress: true

jobs:
  rpc:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch immutable public mirror and verify compiler provenance
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/gha-indie-worker/gha-indie-worker-e2e.git rpc-mirror
          cd rpc-mirror
          git checkout --quiet 2ed709f9949371a4c7b3159dcb37eff0312226c8
          test "$(git rev-parse HEAD)" = "2ed709f9949371a4c7b3159dcb37eff0312226c8"
          while read -r expected path; do
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || {
              echo "::error file=$path::compiler blob mismatch expected=$expected actual=$actual"
              exit 1
            }
          done < rpc-ci/compiler-blobs.txt
          test "$(wc -l < rpc-ci/compiler-blobs.txt)" -eq 56
          test "$(git hash-object rpc-ci/oreslang-rpc/src/rpc.ores)" = "f38c368308865388c4e621c68390008b4f696142"
          test "$(git hash-object rpc-ci/oreslang-rpc/tests/rpc_semantics.ores)" = "be822433df7a864d9c2ecbb58d5a46673d5ba6cd"
          test "$(git hash-object rpc-ci/oreslang-rpc/tests/expected.txt)" = "ccfa2814d18c3ee9c8e343dc50cda4ff45d7cc59"

      - name: Confirm current RPC source identity
        working-directory: rpc-mirror
        run: |
          echo "rpc_head=6a1a714d2536436fc041fe90689d176ceaf37f3b"
          test "$(git hash-object rpc-ci/oreslang-rpc/src/rpc.ores)" = "f38c368308865388c4e621c68390008b4f696142"
          test "$(git hash-object rpc-ci/oreslang-rpc/tests/rpc_semantics.ores)" = "be822433df7a864d9c2ecbb58d5a46673d5ba6cd"

      - name: Compile exact current Oreslang compiler slice
        working-directory: rpc-mirror
        run: mvn -B -ntp -Dmaven.test.skip=true compile

      - name: Typecheck native RPC module directly
        working-directory: rpc-mirror
        run: mvn -B -ntp -Dmaven.test.skip=true exec:java -Dexec.args="--check --platform=server rpc-ci/oreslang-rpc/src/rpc.ores"

      - name: Typecheck linked RPC semantics
        working-directory: rpc-mirror
        run: mvn -B -ntp -Dmaven.test.skip=true exec:java -Dexec.args="--check --platform=server rpc-ci/oreslang-rpc/tests/rpc_semantics.ores"

      - name: Execute RPC semantics and generators
        working-directory: rpc-mirror
        shell: bash
        run: |
          set -euo pipefail
          if ! mvn -q -Dstyle.color=never -Dmaven.test.skip=true exec:java -Dexec.args="--platform=server rpc-ci/oreslang-rpc/tests/rpc_semantics.ores" > rpc-ci/oreslang-rpc/tests/actual.txt 2> rpc-ci/runtime.err; then
            echo "=== RPC stdout before failure ==="
            cat rpc-ci/oreslang-rpc/tests/actual.txt || true
            echo "=== RPC stderr ==="
            cat rpc-ci/runtime.err || true
            exit 1
          fi
          diff -u rpc-ci/oreslang-rpc/tests/expected.txt rpc-ci/oreslang-rpc/tests/actual.txt
